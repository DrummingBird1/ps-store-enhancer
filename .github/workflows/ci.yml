name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, type-check, syntax-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev deps
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint --if-present

      - name: Type-check (JSDoc) the pure helper files
        run: npm run typecheck --if-present

      - name: Syntax-check every extension script
        run: |
          for f in extension/*.js; do
            node --check "$f"
            echo "$f OK"
          done

      - name: CSP guard (no inline scripts, handlers or eval in extension pages)
        run: python3 scripts/check-csp.py

      - name: Validate locale JSON
        run: |
          python3 - <<'PY'
          import json, sys, pathlib
          base = pathlib.Path("extension/_locales")
          en_keys = set(json.loads((base/"en"/"messages.json").read_text(encoding="utf-8")).keys())
          ok = True
          for lang_dir in sorted(base.iterdir()):
              if not lang_dir.is_dir(): continue
              data = json.loads((lang_dir/"messages.json").read_text(encoding="utf-8"))
              keys = set(data.keys())
              missing = en_keys - keys
              extra = keys - en_keys
              print(f"{lang_dir.name}: {len(keys)} keys; missing {len(missing)}; extra {len(extra)}")
              if missing or extra: ok = False
          sys.exit(0 if ok else 1)
          PY

      - name: Test
        run: npm test --if-present

      - name: Build both targets (smoke)
        run: |
          python3 scripts/build.py
          python3 scripts/build.py --target firefox
