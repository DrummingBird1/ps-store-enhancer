name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build zip and create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Read version, product name, and this release's changelog section
        id: meta
        run: |
          python <<'PY'
          import json, re, os

          manifest = json.load(open("extension/manifest.json", encoding="utf-8"))
          version = manifest["version"]
          tag = os.environ.get("GITHUB_REF_NAME") or f"v{version}"

          locale = json.load(open("extension/_locales/en/messages.json", encoding="utf-8"))
          product_name = locale["extName"]["message"]

          # Pull this version's section out of CHANGELOG.md: from "## vX.Y.Z" up to (not
          # including) the next "<a id=" anchor, which marks the start of the next release.
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          anchor = "v" + version.replace(".", "-")
          heading_re = re.compile(rf'^## v{re.escape(version)}\b.*$', re.MULTILINE)
          m = heading_re.search(changelog)
          if m:
              start = m.start()
              next_anchor = changelog.find('<a id="v', m.end())
              section = changelog[start:next_anchor if next_anchor != -1 else len(changelog)].strip()
              # Strip the "<br clear=right>" / "---" separator this file uses between releases.
              section = re.sub(r'\s*<br clear="right">\s*\Z', '', section)
              section = re.sub(r'\s*---\s*\Z', '', section).strip()
          else:
              section = "See [CHANGELOG.md](https://github.com/DrummingBird1/ps-store-enhancer/blob/main/CHANGELOG.md)."

          badge_url = f"https://raw.githubusercontent.com/DrummingBird1/ps-store-enhancer/main/assets/badges/{anchor}.png"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"tag={tag}\n")
              out.write(f"product_name={product_name}\n")
              out.write(f"badge_url={badge_url}\n")
              delim = "CHANGELOG_EOF"
              out.write(f"changelog_section<<{delim}\n{section}\n{delim}\n")

          print(f"Building {product_name} {tag}")
          PY

      - name: Build zip (dist/)
        run: python scripts/build.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.product_name }} ${{ steps.meta.outputs.tag }}
          body: |
            <img src="${{ steps.meta.outputs.badge_url }}" width="96" align="right" alt="${{ steps.meta.outputs.tag }}">

            ${{ steps.meta.outputs.changelog_section }}

            ---

            **Download:** `ps-store-enhancer-${{ steps.meta.outputs.tag }}.zip` — unzip and load via `chrome://extensions` → "Load unpacked", or upload directly to the Chrome Web Store dashboard.
          files: |
            dist/ps-store-enhancer-${{ steps.meta.outputs.tag }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
